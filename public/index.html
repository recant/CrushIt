<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goal Governor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">GOAL GOVERNOR</p>
      <h1>You choose the outcome.<br />The agent chooses today.</h1>
      <p class="lede">A zero-management goal system powered by one persistent Maritime agent per person.</p>
    </div>
    <button id="refresh">Refresh</button>
  </header>

  <main>
    <section class="setup panel">
      <h2>1. Create a person</h2>
      <form id="user-form">
        <div class="grid two">
          <label>Name<input name="name" required placeholder="Sawyer" /></label>
          <label>Timezone<input name="timezone" value="America/New_York" /></label>
          <label>Morning command time<input name="morningTime" type="time" value="07:00" /></label>
          <label>Delivery
            <select name="notificationChannel">
              <option value="console">Console demo</option>
              <option value="maritime">Maritime WhatsApp/Telegram</option>
              <option value="sms">Twilio SMS</option>
              <option value="email">Resend email</option>
            </select>
          </label>
          <label>Email<input name="email" type="email" placeholder="you@example.com" /></label>
          <label>Phone<input name="phone" placeholder="+16175551234" /></label>
          <label>Failure penalty ($)<input name="penalty" type="number" min="0" step="1" value="5" /></label>
          <label>Weekly penalty cap ($)<input name="cap" type="number" min="0" step="1" value="20" /></label>
          <label>Commitment balance ($)<input name="balance" type="number" min="0" step="1" value="50" /></label>
          <label>Agent spending budget/week ($)<input name="budget" type="number" min="0" step="1" value="30" /></label>
        </div>
        <label>Hard boundaries<textarea name="boundaries" placeholder="Never cancel class. Never spend over $20 without asking. No medical directives."></textarea></label>
        <button type="submit">Create person</button>
      </form>
    </section>

    <section class="setup panel">
      <h2>2. State one outcome</h2>
      <form id="goal-form">
        <label>Person<select name="userId" id="goal-user" required></select></label>
        <label>Outcome<textarea name="outcome" required placeholder="Get five active users for my healthcare AI product by September 1."></textarea></label>
        <label>Target date<input name="targetDate" type="date" /></label>
        <button type="submit">Activate goal</button>
      </form>
    </section>

    <section class="panel wide">
      <div class="section-head">
        <div><p class="eyebrow">CONTROL SURFACE</p><h2>People and goals</h2></div>
      </div>
      <div id="people" class="cards"></div>
    </section>

    <section class="panel wide">
      <div class="section-head">
        <div><p class="eyebrow">TODAY</p><h2>Mandatory directives</h2></div>
      </div>
      <div id="directives" class="cards"></div>
    </section>

    <section class="panel wide">
      <div class="section-head">
        <div><p class="eyebrow">ENFORCEMENT LEDGER</p><h2>Consequences</h2></div>
      </div>
      <div id="penalties" class="cards"></div>
    </section>
  </main>

  <template id="empty-template"><p class="empty">Nothing here yet.</p></template>
  <script type="module" src="/app.js"></script>
</body>
</html>
